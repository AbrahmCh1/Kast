# Compila Kast para Windows y macOS en cada push/PR y publica un Release al subir una etiqueta v*
# (p. ej. v1.1.0). Las versiones con guion (v1.1.0-beta.1) se publican como prerelease.
name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Compilar
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v', '' }
                     else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          ./build.ps1 -Version $version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $reported = (./bin/kast.exe version).Trim()
          if ($reported -ne "kast $version") { throw "versión inesperada: '$reported'" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Probar Kast Link
        shell: pwsh
        run: |
          cargo test --release --locked --manifest-path link/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./bin/kast-link.exe version
          ./bin/kast-link.exe play link/testdata/patron-windows.klnk
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Empaquetar
        shell: pwsh
        run: |
          $name = "Kast-$env:VERSION-win-x64"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item bin/kast.exe, bin/kastd.exe, bin/kast-link.exe, bin/WebView2Loader.dll, bin/kast.ini, LICENSE, README.md $dir
          Copy-Item third_party/webview2/LICENSE.txt "$dir/WebView2-LICENSE.txt"
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File "dist/$name.zip.sha256" -Encoding ascii -NoNewline
          "PKG=$name" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: |
            dist/${{ env.PKG }}.zip
            dist/${{ env.PKG }}.zip.sha256

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar Kast Link (universal)
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --manifest-path link/Cargo.toml --target "$t"
          done
          mkdir -p link/target/universal
          lipo -create -output link/target/universal/kast-link \
            link/target/aarch64-apple-darwin/release/kast-link link/target/x86_64-apple-darwin/release/kast-link
          lipo -archs link/target/universal/kast-link

      - name: Prueba cruzada de Kast Link
        run: |
          L=link/target/universal/kast-link
          mkdir -p link-pruebas
          "$L" list
          # Flujo H.264 generado por Media Foundation en Windows -> decodificado con VideoToolbox.
          "$L" play link/testdata/patron-windows.klnk --dump link-pruebas/windows-en-mac.bmp
          # Captura con ScreenCaptureKit + codificación VideoToolbox (requiere permiso de grabación de pantalla).
          if "$L" record -m 1 --frames 60 link-pruebas/mac.klnk; then
            "$L" play link-pruebas/mac.klnk --dump link-pruebas/mac-en-mac.bmp
          else
            echo "::warning::sin captura de pantalla en el runner (permiso de grabación)"
          fi
          # De punta a punta con dos agentes: descubrimiento, petición, código, aceptación, vídeo y rechazo.
          python3 link/tests/e2e.py "$L" link-pruebas/en-vivo.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-pruebas-macos
          path: link-pruebas/
          if-no-files-found: ignore

      # Firma con Developer ID si el repositorio tiene los secretos (si no, firma ad hoc).
      - name: Certificado de firma
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12" ]; then echo "::notice::sin certificado: firma ad hoc"; exit 0; fi
          KC="$RUNNER_TEMP/firma.keychain-db"
          KC_PW="$(uuidgen)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          printf '%s' "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID="$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          test -n "$ID" || { echo "::error::el .p12 no contiene un certificado Developer ID Application"; exit 1; }
          echo "Firmando como: $ID"
          echo "KAST_SIGN_ID=$ID" >> "$GITHUB_ENV"
          echo "KAST_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Compilar
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then V="${GITHUB_REF_NAME#v}"; else V="dev-${GITHUB_SHA::7}"; fi
          bash mac/build.sh "$V"
          BIN=mac/build/Kast.app/Contents/MacOS/Kast
          test "$("$BIN" version)" = "kast $V"
          lipo -archs "$BIN"
          codesign --verify --strict --verbose mac/build/Kast.app
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Notarizar
        if: env.KAST_SIGN_ID != ''
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then echo "::warning::firmada pero sin notarizar: faltan los secretos ASC_*"; exit 0; fi
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          ditto -c -k --keepParent mac/build/Kast.app "$RUNNER_TEMP/notarizar.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarizar.zip" --key "$KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
          rm -f "$KEY"
          if ! grep -q '"status" *: *"Accepted"' "$RUNNER_TEMP/notary.json"; then
            SUB="$(sed -n 's/.*"id" *: *"\([^"]*\)".*/\1/p' "$RUNNER_TEMP/notary.json" | head -1)"
            printf '%s\n' "$ASC_KEY_P8" > "$KEY"
            [ -n "$SUB" ] && xcrun notarytool log "$SUB" --key "$KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
            rm -f "$KEY"
            echo "::error::Apple rechazó la notarización"; exit 1
          fi
          xcrun stapler staple mac/build/Kast.app
          spctl --assess --type execute -vv mac/build/Kast.app

      - name: Prueba de humo
        run: |
          BIN=mac/build/Kast.app/Contents/MacOS/Kast
          "$BIN" help | head -2
          "$BIN" list || echo "(sin DDC en el runner)"
          "$BIN" modes p | head -3 || true
          "$BIN" layout save ci-prueba
          "$BIN" layout list | grep -qx ci-prueba
          "$BIN" layout del ci-prueba
          "$BIN" fav
          open mac/build/Kast.app
          sleep 6
          pgrep -x Kast
          "$BIN" status
          "$BIN" ui
          sleep 6
          screencapture -x mac/build/captura.png
          pgrep -x Kast
          "$BIN" stop
          sleep 3
          ! pgrep -x Kast

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captura-macos
          path: mac/build/captura.png
          if-no-files-found: ignore

      - name: Empaquetar
        run: |
          # La prueba de humo no puede haber tocado el paquete firmado.
          codesign --verify --strict --verbose mac/build/Kast.app
          NAME="Kast-$VERSION-macos"
          mkdir -p dist
          ditto -c -k --keepParent mac/build/Kast.app "dist/$NAME.zip"
          (cd dist && shasum -a 256 "$NAME.zip" > "$NAME.zip.sha256")
          echo "PKG=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: |
            dist/${{ env.PKG }}.zip
            dist/${{ env.PKG }}.zip.sha256

      - name: Borrar el llavero temporal
        if: always() && env.KAST_KEYCHAIN != ''
        run: security delete-keychain "$KAST_KEYCHAIN" || true

  release:
    if: github.ref_type == 'tag'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: Kast-*
          merge-multiple: true

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && PRE="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Kast ${GITHUB_REF_NAME#v}" --generate-notes $PRE
