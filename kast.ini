# Kast — configuración (generada por la interfaz; también puede editarse a mano)
# Comandos: kast help    Monitores: 1,2,3 | all | p (principal) | c (el del cursor)

[favoritos]
Noche = b all 20; c all 40
Normal = b all 50; c all 50
Día = b all 100; c all 75

[atajos]
ctrl+alt+up = b c +10
ctrl+alt+down = b c -10
ctrl+alt+shift+up = b all +10
ctrl+alt+shift+down = b all -10
ctrl+alt+1 = fav Noche
ctrl+alt+2 = fav Normal
ctrl+alt+3 = fav Día
ctrl+alt+end = off
ctrl+alt+shift+l = lock; off
ctrl+alt+shift+e = topo extend
ctrl+alt+shift+d = topo clone
ctrl+alt+shift+p = primary c
ctrl+alt+k = ui
