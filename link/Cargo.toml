[package]
name = "kast-link"
version = "0.1.0"
edition = "2024"
description = "Ver la pantalla de otro equipo por la red local, cifrado (parte de Kast)"
license = "MIT"
repository = "https://github.com/AbrahmCh1/Kast"

[dependencies]
getrandom = "0.4.3"
if-addrs = "0.15.0"
# Imágenes del portapapeles compartido (PNG), en Rust puro.
png = "0.17"
serde_json = "1.0.154"
# Sólo lo que usa Noise_NNpsk0_25519_ChaChaPoly_BLAKE2s, en Rust puro (sin ring ni compilador de C).
# Sin la feature "std": en snow 0.10 activa "ring/std" y con ello ring (que necesita compilador de C).
snow = { version = "0.10.0", default-features = false, features = ["default-resolver", "use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom"] }
socket2 = { version = "0.6.5", features = ["all"] }

# Ventanas del visor (escritorio; en iOS las pone la app).
[target.'cfg(not(target_os = "ios"))'.dependencies]
softbuffer = "0.4.8"
winit = "0.30.13"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11", "Win32_Graphics_Gdi", "Win32_Media_MediaFoundation", "Win32_System_Com",
    "Win32_System_Variant", "Win32_System_Ole", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell", "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSImageRep", "NSBitmapImageRep"] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-foundation = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
objc2-video-toolbox = "0.3.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
